[project]
name = "fuel-route"
version = "1.0.0"
description = "Cheapest legal diesel purchase plan for a truck route across the USA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==6.1.1",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.28.0",
    "django-environ>=0.12.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-django>=4.9.0",
    "scipy>=1.15.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "django-stubs[compatible-mypy]>=5.1.1",
    "djangorestframework-stubs>=3.15.2",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["live: hits the real routing provider; run before demos only"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["apps.routing.geo", "apps.routing.corridor", "apps.routing.optimizer"]
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings"
